# People of the Automation and Robotics Laboratory.
#
# Groups are rendered on the /people/ page as cards, each showing
# Name, Surname, Role and a round photo.
#
# Fields for each member:
#   name     : first name (required)
#   surname  : last name  (required)
#   role     : role / position (required)
#   image    : optional photo path under /assets/img/people/
#              (leave empty to show an initials avatar instead)
#
# Example:
#   - name: Mario
#     surname: Rossi
#     role: Full Professor
#     image: /assets/img/people/mario-rossi.jpg

groups:
  - title: Professors
    members:
      - name: Maria Gabriella
        surname: Xibilia
        role: Associate Professor
        image: /assets/img/people/MGX.jpg
      - name: Luca
        surname: Patanè
        role: Associate Professor
        image: /assets/img/people/LP.jpg

  - title: Researchers
    members:
      - name: Francesca
        surname: Sapuppo
        role: Research Fellow
        image: /assets/img/people/FS.jpg

  - title: PhD Students
    members:
      - name: Antonino
        surname: Maio
        role: PhD Student
        image: /assets/img/people/AM.jpg
      - name: Gianluca
        surname: Ragusa
        role: PhD Student