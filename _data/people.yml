# People of the Automation and Robotics Laboratory.
#
# Groups are rendered on the /people/ page as cards, each showing
# Name, Surname, Role, a round photo and (when set) an email icon.
#
# Fields for each member:
#   name     : first name (required)
#   surname  : last name  (required)
#   role     : role / position (required)
#   image    : optional photo path under /assets/img/people/
#              (leave empty to show an initials avatar instead)
#   email    : optional address; when set, a mail icon is shown on the card
#              (leave empty to hide it)
#
# Example:
#   - name: Mario
#     surname: Rossi
#     role: Full Professor
#     image: /assets/img/people/mario-rossi.jpg
#     email: mario.rossi@unime.it

groups:
